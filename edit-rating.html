<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Rating</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header>
    <h1>Edit Student Rating</h1>
    <nav>
      <a href="ratings.html">Back to Ratings</a>
    </nav>
  </header>

  <main>
    <form class="form-edit" action="#" method="post">
      <label>
        Student Name:
        <input type="text" name="name" value="Pyotr Petrov">
      </label>
      <label>
        Group:
        <input type="text" name="group" value="KN-22">
      </label>
      <label>
        Rating:
        <input type="number" name="rating" value="92" min="0" max="100">
      </label>
      <button type="submit" class="btn">Save</button>
      <a href="ratings.html" class="btn">Cancel</a>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Web Development Department</p>
  </footer>
</html>
