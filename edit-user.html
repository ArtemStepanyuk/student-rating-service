<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/main.css">
  <title>Edit User</title>
</head>
<body>
  <header class="site-header">
    <h1>Edit User</h1>
    <nav class="site-nav">
      <a href="users.html">Back</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>User Details</h2>
      <form action="#" method="post" class="form-edit">
        <label for="edit-username">Username</label>
        <input type="text" id="edit-username" name="username" value="ivan" required>
        <span class="error-text"></span>

        <label for="edit-password">Password</label>
        <input type="password" id="edit-password" name="password" minlength="6">
        <span class="error-text"></span>

        <label for="confirm-edit-password">Confirm Password</label>
        <input type="password" id="confirm-edit-password" name="confirm_password">
        <span class="error-text"></span>

        <label for="edit-role-select">Role</label>
        <select id="edit-role-select" name="role" required>
          <option value="" disabled selected>Select role</option>
          <option value="admin">Admin</option>
          <option value="regular">Regular</option>
        </select>
        <span class="error-text"></span>

        <button type="submit" class="btn">Save</button>
        <a href="users.html" class="btn">Cancel</a>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Web Development Department</p>
  </footer>
</body>
</html>
