<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/main.css">
  <title>Create User</title>
</head>
<body>
  <header class="site-header">
    <h1>Create User</h1>
    <nav class="site-nav">
      <a href="users.html">Back</a>
    </nav>
  </header>

  <main>
    <section class="form-section">
      <h2>New User</h2>
      <form action="users.html" method="get" class="form-create">
        <label for="new-username">Username</label>
        <input type="text" id="new-username" name="username" required>
        <span class="error-text"></span>

        <label for="new-password">Password</label>
        <input type="password" id="new-password" name="password" required minlength="6">
        <span class="error-text"></span>

        <label for="confirm-password">Confirm Password</label>
        <input type="password" id="confirm-password" name="confirm_password" required>
        <span class="error-text"></span>

        <label for="role-select">Role</label>
        <select id="role-select" name="role" required>
          <option value="" disabled selected>Select role</option>
          <option value="admin">Admin</option>
          <option value="regular">Regular</option>
        </select>
        <span class="error-text"></span>

        <button type="submit" class="btn">Submit</button>
        <a href="users.html" class="btn">Cancel</a>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Web Development Department</p>
  </footer>
</body>
</html>
