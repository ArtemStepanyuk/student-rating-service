<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/main.css">
  <title>Login — Student Rating Service</title>
</head>
<body>
  <header class="site-header">
    <h1>Student Rating Service</h1>
  </header>

  <main>
    <section class="auth-section">
      <h2>Sign In</h2>
      <form action="users.html" method="get" class="auth-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        <span class="error-text" aria-live="polite"></span>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        <span class="error-text" aria-live="polite"></span>

        <button type="submit" class="btn">Log In</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Web Development Department</p>
  </footer>
</body>
</html>
